plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bengkelku.sunmitest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bengkelku.sunmitest'
        minSdk 25
        targetSdk 25
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
