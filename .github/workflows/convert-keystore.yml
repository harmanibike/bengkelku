
name: Convert Existing BengkelKu Keystore

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Download existing keystore
        uses: actions/download-artifact@v4
        with:
          name: bengkelku-signing-key
          path: signing
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 44951766458

      - name: Convert to Base64
        run: |
          set -e
          base64 -w 0 signing/bengkelku-release.jks > keystore-base64.txt

      - name: Upload Base64 file
        uses: actions/upload-artifact@v4
        with:
          name: bengkelku-keystore-base64
          path: keystore-base64.txt
          retention-days: 1
          
