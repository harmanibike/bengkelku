
name: Generate BengkelKu Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate permanent keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "GitHub Secrets belum lengkap."
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore bengkelku-release.jks \
            -storetype JKS \
            -alias bengkelku \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=BengkelKu POS, OU=Development, O=BengkelKu, C=ID" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS"

      - name: Upload keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: bengkelku-signing-key
          path: bengkelku-release.jks
          retention-days: 1
