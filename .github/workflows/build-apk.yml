name: Build Bike POS APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bike-pos-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Generate Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name bengkelku_pos .
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle plugin repositories
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/settings.gradle.kts")
          source = path.read_text()
          start = source.find("pluginManagement {")
          if start < 0:
              raise SystemExit("Blok pluginManagement tidak ditemukan.")

          repo_start = source.find("repositories {", start)
          if repo_start < 0:
              raise SystemExit("Blok repositories dalam pluginManagement tidak ditemukan.")

          insert_at = repo_start + len("repositories {")
          repo_block_end = source.find("}", insert_at)
          if repo_block_end < 0:
              raise SystemExit("Penutup repositories tidak ditemukan.")

          repo_block = source[insert_at:repo_block_end]
          additions = []
          if "google()" not in repo_block:
              additions.append("        google()")
          if "mavenCentral()" not in repo_block:
              additions.append("        mavenCentral()")

          if additions:
              source = source[:insert_at] + "\n" + "\n".join(additions) + source[insert_at:]
              path.write_text(source)

          print("Gradle plugin repositories siap: Google dan Maven Central.")
          PY

      - name: Declare camera permission for barcode scanning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          permission = '    <uses-permission android:name="android.permission.CAMERA" />'

          if "android.permission.CAMERA" not in source:
              source, count = re.subn(r'(<application\b)', lambda match: permission + "\n\n" + match.group(1), source, count=1)
              if count != 1:
                  raise SystemExit("Tag application pada AndroidManifest.xml tidak ditemukan.")
              path.write_text(source)

          print("Izin kamera disiapkan untuk pemindai barcode.")
          PY

      - name: Declare Android foreground service for the LAN Server
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />',
              '    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />',
          ]
          missing = [item for item in permissions if item.split('"')[1] not in source]
          if missing:
              block = "\n".join(missing) + "\n"
              source, count = re.subn(r'(<application\b)', lambda match: block + match.group(1), source, count=1)
              if count != 1:
                  raise SystemExit("Tag application AndroidManifest.xml tidak ditemukan.")
          service = """
              <service
                  android:name="com.pravera.flutter_foreground_task.service.ForegroundService"
                  android:foregroundServiceType="connectedDevice"
                  android:exported="false" />
          """
          if "com.pravera.flutter_foreground_task.service.ForegroundService" not in source:
              source = source.replace("</application>", service + "\n</application>", 1)
          manifest.write_text(source)
          print("Foreground service connectedDevice disiapkan; tidak auto-start saat boot.")
          PY

      - name: Declare local network permissions for Server and Client API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
          ]
          missing = [item for item in permissions if item.split('"')[1] not in source]
          if missing:
              block = "\n".join(missing) + "\n"
              source, count = re.subn(r'(<application\b)', lambda match: block + match.group(1), source, count=1)
              if count != 1:
                  raise SystemExit("Tag application AndroidManifest.xml tidak ditemukan.")
          if 'android:usesCleartextTraffic=' not in source:
              source, count = re.subn(
                  r'(<application\b)',
                  r'\1 android:usesCleartextTraffic="true"',
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Tag application AndroidManifest.xml tidak ditemukan.")
          path.write_text(source)
          print("Izin jaringan dan HTTP LAN lokal disiapkan.")
          PY

      - name: Declare Android contacts read permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          permission = '    <uses-permission android:name="android.permission.READ_CONTACTS" />'

          if "android.permission.READ_CONTACTS" not in source:
              source, count = re.subn(r'(<application\b)', lambda match: permission + "\n\n" + match.group(1), source, count=1)
              if count != 1:
                  raise SystemExit("Tag application pada AndroidManifest.xml tidak ditemukan.")
              path.write_text(source)

          print("Izin baca kontak Android disiapkan.")
          PY

      - name: Declare Bluetooth permissions for thermal printers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="28" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
          ]

          missing = [item for item in permissions if item.split('"')[1] not in source]
          if missing:
              block = "\n".join(missing) + "\n\n"
              source, count = re.subn(r'(<application\b)', lambda match: block + match.group(1), source, count=1)
              if count != 1:
                  raise SystemExit("Tag application pada AndroidManifest.xml tidak ditemukan.")
              path.write_text(source)

          print("Izin Bluetooth Android 6–16 disiapkan untuk koneksi printer.")
          PY

      - name: Set Android app display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()

          source, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="Bike POS"',
              source,
              count=1
          )

          if count != 1:
              raise SystemExit("android:label tidak ditemukan.")

          path.write_text(source)
          print("Nama aplikasi: Bike POS")
          PY

      - name: Generate rounded Bike POS launcher icons from official image
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("assets/branding/bike_pos_icon.png")
          if not source.exists():
              raise SystemExit("Aset ikon Bike POS tidak ditemukan di assets/branding/bike_pos_icon.png.")

          image = Image.open(source).convert("RGBA")
          if image.width != image.height:
              raise SystemExit(f"Logo harus persegi, ditemukan {image.size}.")
          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }
          for density, size in sizes.items():
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(folder / "ic_launcher.png", optimize=True)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          import re
          content, count = re.subn(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', content, count=1)
          if count != 1:
              raise SystemExit("Atribut android:icon tidak ditemukan.")
          if 'android:roundIcon=' in content:
              content = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher"', content, count=1)
          else:
              content = content.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher"', 1)
          manifest.write_text(content)
          print("Ikon launcher reguler dan rounded dibuat dari gambar Bike POS.")
          PY

      - name: Keep Android navigation bar opaque
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/res/values/styles.xml")
          source = path.read_text()
          item = '        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>'

          if "windowOptOutEdgeToEdgeEnforcement" not in source:
              source, count = re.subn(
                  r'(<style[^>]*>)',
                  lambda match: match.group(1) + "\n" + item,
                  source
              )
              if count == 0:
                  raise SystemExit("Tidak menemukan style Android.")
              path.write_text(source)

          print("Navigation bar Android diatur solid.")
          PY

      - name: Configure Android scheduled stock notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
          ]
          missing = [item for item in permissions if item.split('"')[1] not in source]
          if missing:
              block = "\n".join(missing) + "\n"
              source, count = re.subn(r'(<application\b)', lambda match: block + match.group(1), source, count=1)
              if count != 1:
                  raise SystemExit("Tag application AndroidManifest.xml tidak ditemukan.")
          receivers = """
              <receiver
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"
                  android:exported="false" />
              <receiver
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"
                  android:exported="false">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                  </intent-filter>
              </receiver>
          """
          if "com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" not in source:
              source = source.replace("</application>", receivers + "\n</application>", 1)
          manifest.write_text(source)

          gradle = Path("android/app/build.gradle.kts")
          build = gradle.read_text()
          build = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              build,
              count=1,
          )
          compile_match = re.search(r'compileOptions\s*\{', build)
          if not compile_match:
              raise SystemExit("Blok compileOptions tidak ditemukan.")
          compile_end = build.find("}", compile_match.end())
          if compile_end < 0:
              raise SystemExit("Penutup compileOptions tidak ditemukan.")
          compile_block = build[compile_match.end():compile_end]
          if "isCoreLibraryDesugaringEnabled" not in compile_block:
              build = build[:compile_end] + "\n        isCoreLibraryDesugaringEnabled = true" + build[compile_end:]
          if "coreLibraryDesugaring(" not in build:
              dependency_match = re.search(r'dependencies\s*\{', build)
              if not dependency_match:
                  build += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              else:
                  dependency_end = build.find("}", dependency_match.end())
                  build = build[:dependency_end] + '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n' + build[dependency_end:]
          gradle.write_text(build)
          print("Permission, receiver notifikasi, compileSdk 36, dan core library desugaring siap.")
          PY

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ${{ runner.os }}-android-ndk-28.2.13676358

      - name: Install Android NDK with retry
        run: |
          # sdkmanager menutup stdin setelah konfirmasi; abaikan SIGPIPE dari yes,
          # tetapi tetap gunakan exit code sdkmanager sebagai hasil instalasi.
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager tidak ditemukan: $SDKMANAGER"
            exit 1
          fi

          for attempt in 1 2 3; do
            if [ -f "$NDK_DIR/source.properties" ]; then
              echo "Android NDK $NDK_VERSION sudah terpasang."
              exit 0
            fi

            echo "Menginstal Android NDK $NDK_VERSION (percobaan $attempt/3)."
            rm -rf "$NDK_DIR"
            if yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" &&
               [ -f "$NDK_DIR/source.properties" ]; then
              echo "Android NDK $NDK_VERSION berhasil dipasang."
              exit 0
            fi

            rm -rf "$NDK_DIR"
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          echo "Android NDK gagal dipasang setelah 3 percobaan."
          exit 1

      - name: Install dependencies
        run: flutter pub get

      - name: Align Android SDK for all Flutter plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          files = list(cache.glob("*/android/build.gradle")) + list(cache.glob("*/android/build.gradle.kts"))
          if not files:
              raise SystemExit("Tidak menemukan Gradle Android milik plugin Flutter.")

          changed = []
          for path in files:
              source = path.read_text()
              updated = re.sub(
                  r'(compileSdkVersion\s+)(?:flutter\.compileSdkVersion|[0-9]+)',
                  r'\g<1>36',
                  source,
              )
              updated = re.sub(
                  r'(compileSdk\s*=\s*)(?:flutter\.compileSdkVersion|[0-9]+)',
                  r'\g<1>36',
                  updated,
              )
              if updated != source:
                  path.write_text(updated)
                  changed.append(str(path))

          print(f"SDK Android plugin diselaraskan ke 36 pada {len(changed)} file.")
          for path in changed:
              print(path)
          PY

      - name: Patch legacy usb_serial Android repository
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          files = list(cache.glob("usb_serial-*/android/build.gradle"))
          if not files:
              raise SystemExit("Gradle file usb_serial tidak ditemukan setelah flutter pub get.")

          for path in files:
              source = path.read_text()
              updated = source.replace("jcenter()", "mavenCentral()")
              if updated != source:
                  path.write_text(updated)
                  print(f"Repository JCenter diganti Maven Central: {path}")
              else:
                  print(f"Tidak ada deklarasi JCenter: {path}")
          PY

      - name: Format Dart code
        run: dart format lib

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Install SQLite native library for FFI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Run tests
        run: flutter test

      - name: Prepare permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "Signing secrets belum lengkap."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/bengkelku-release.jks

          chmod 600 android/app/bengkelku-release.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=bengkelku
          storeFile=bengkelku-release.jks
          EOF

          chmod 600 android/key.properties

      - name: Configure Android release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          source = path.read_text()

          imports = (
              "import java.io.FileInputStream\n"
              "import java.util.Properties\n\n"
          )

          if "import java.util.Properties" not in source:
              source = imports + source

          loader = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          keystoreProperties.load(FileInputStream(keystorePropertiesFile))

          """

          if "val keystoreProperties = Properties()" not in source:
              if "android {" not in source:
                  raise SystemExit("Blok android tidak ditemukan.")

              source = source.replace(
                  "android {",
                  loader + "android {",
                  1
              )

          signing = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          """

          if 'create("release")' not in source:
              if "    buildTypes {" not in source:
                  raise SystemExit("Blok buildTypes tidak ditemukan.")

              source = source.replace(
                  "    buildTypes {",
                  signing + "    buildTypes {",
                  1
              )

          old = 'signingConfig = signingConfigs.getByName("debug")'
          new = 'signingConfig = signingConfigs.getByName("release")'

          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("Konfigurasi release tidak ditemukan.")

          path.write_text(source)
          print("Release signing berhasil dikonfigurasi.")
          PY

      - name: Disable crashing Android lint checks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          source = path.read_text()

          marker = '    lint {\n        disable += setOf("EasterEgg", "StopShip")\n    }\n\n'

          if 'disable += setOf("EasterEgg", "StopShip")' not in source:
              if "android {" not in source:
                  raise SystemExit("Blok android tidak ditemukan.")

              source = source.replace(
                  "android {",
                  "android {\n" + marker,
                  1
              )
              path.write_text(source)

          print("Android Lint EasterEgg dan StopShip dinonaktifkan.")
          PY

      - name: Disable crashing lint tasks in all Android modules
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/build.gradle.kts")
          source = path.read_text()

          marker = "// BengkelKu: workaround for Android Lint CommentDetector crash"
          block = """
          // BengkelKu: workaround for Android Lint CommentDetector crash
          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          """

          if marker not in source:
              path.write_text(source.rstrip() + "\n\n" + block)

          print("Semua tugas lintVital pada modul Android dinonaktifkan.")
          PY

      - name: Build signed APK with network backoff
        run: |
          set -eu
          VERSION="$(awk -F '[:+ ]' '/^version:/{print $2; exit}' pubspec.yaml)"
          if [ -z "$VERSION" ]; then
            echo "Nomor versi tidak ditemukan di pubspec.yaml."
            exit 1
          fi
          echo "Membangun Bike POS versi $VERSION"
          for attempt in 1 2 3; do
            echo "Build APK attempt $attempt/3"
            if flutter build apk --release --dart-define=APP_VERSION="$VERSION"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 45))
              echo "Build gagal; jeda ${delay}s sebelum mencoba kembali."
              sleep "$delay"
            fi
          done
          echo "Build APK gagal setelah tiga percobaan."
          exit 1

      - name: Verify APK signature
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          jarsigner -verify -verbose -certs "$APK"

      - name: Rename Bike POS APK with version
        run: |
          VERSION="$(awk -F '[:+ ]' '/^version:/{print $2; exit}' pubspec.yaml)"
          if [ -z "$VERSION" ]; then
            echo "Nomor versi tidak ditemukan di pubspec.yaml."
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk \\
             "build/app/outputs/flutter-apk/Bike-POS-v${VERSION}.apk"
          echo "APK siap: Bike-POS-v${VERSION}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v5
        with:
          name: Bike-POS
          path: build/app/outputs/flutter-apk/Bike-POS-v*.apk
          retention-days: 14

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f android/app/bengkelku-release.jks
          rm -f android/key.properties
