name: bengkelku_pos
description: Aplikasi kasir dan manajemen bengkel sepeda BengkelKu POS.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  path: ^1.9.1
  sqflite: ^2.4.2
  crypto: ^3.0.6
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  file_picker: ^10.3.10
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/bengkelku_logo.jpg
